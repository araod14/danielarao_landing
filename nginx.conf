server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 32k;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    # Recupera la IP del visitante detras del nginx del HOST. Sin esto, remote_addr
    # es siempre la misma direccion y todos los visitantes compartirian el mismo
    # cubo del rate limit de /api/contact (5 envios / 900 s).
    #
    # Las dos direcciones son las que Docker usa realmente segun por donde entre
    # el trafico al puerto publicado en 127.0.0.1:8081 (DNAT conserva el origen
    # loopback; el proxy de usuario lo reescribe a la gateway de la red). Ambas
    # son alcanzables solo desde el propio host o desde 'api', nunca desde fuera:
    # el puerto no esta publicado en ninguna interfaz publica.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.30.14.1;
    real_ip_header X-Forwarded-For;
    # 'off' toma la ULTIMA direccion de X-Forwarded-For, que es la que anade el
    # nginx del host y por tanto la unica que un visitante no puede falsificar.
    real_ip_recursive off;

    location / {
        try_files $uri $uri/ =404;
    }

    location /api/ {
        # Resolve at request time so static pages work even when the API is down.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $contact_backend api:8000;
        proxy_pass http://$contact_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }

    location ~ /\. {
        deny all;
    }
}
